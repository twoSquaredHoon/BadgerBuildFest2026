<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Pet owners and the cost of care">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #8A8F87; }
    .label { font-size: 15px; fill: #8A8F87; }
    .value { font-size: 17px; font-weight: 700; }
  </style>
  <text x="264" y="22" class="title">Pet owners and the cost of care</text>
  <text x="250" y="61" text-anchor="end" dominant-baseline="central" class="label">Skipped or declined care</text>
  <rect x="264" y="44" width="233.0" height="34" rx="8" fill="#C2410C"/>
  <text x="484.96000000000004" y="61" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">52%</text>
  <text x="250" y="113" text-anchor="end" dominant-baseline="central" class="label">Cost was the reason</text>
  <rect x="264" y="96" width="318.1" height="34" rx="8" fill="#C2410C"/>
  <text x="570.0799999999999" y="113" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">71%</text>
  <text x="250" y="165" text-anchor="end" dominant-baseline="central" class="label">No cheaper option offered</text>
  <rect x="264" y="148" width="327.0" height="34" rx="8" fill="#C2410C"/>
  <text x="579.04" y="165" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">73%</text>
  <text x="250" y="217" text-anchor="end" dominant-baseline="central" class="label">Pet got worse or died</text>
  <rect x="264" y="200" width="62.7" height="34" rx="8" fill="#C2410C"/>
  <text x="314.72" y="217" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">14%</text>
</svg>
