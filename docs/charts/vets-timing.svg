<svg xmlns="http://www.w3.org/2000/svg" width="720" height="208" viewBox="0 0 720 208" role="img" aria-label="When vets bring up the client's finances">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #8A8F87; }
    .label { font-size: 15px; fill: #8A8F87; }
    .value { font-size: 17px; font-weight: 700; }
  </style>
  <text x="264" y="22" class="title">When vets bring up the client's finances</text>
  <text x="250" y="61" text-anchor="end" dominant-baseline="central" class="label">Before recommending</text>
  <rect x="264" y="44" width="76.2" height="34" rx="8" fill="#2E6A4E"/>
  <text x="328.16" y="61" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">17%</text>
  <text x="250" y="113" text-anchor="end" dominant-baseline="central" class="label">After recommending</text>
  <rect x="264" y="96" width="219.5" height="34" rx="8" fill="#2E6A4E"/>
  <text x="471.52" y="113" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">49%</text>
  <text x="250" y="165" text-anchor="end" dominant-baseline="central" class="label">Only if the client asks</text>
  <rect x="264" y="148" width="152.3" height="34" rx="8" fill="#2E6A4E"/>
  <text x="404.32000000000005" y="165" text-anchor="end" dominant-baseline="central" class="value" fill="#FFFFFF">34%</text>
</svg>
